name: Release
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.branch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch:
          - 1.21
          - dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}

      - name: Read branch version config
        id: config
        shell: bash
        run: |
          mc_version="$(sed -n 's/^minecraft_version=//p' gradle.properties | head -n1)"
          if [[ -z "$mc_version" ]]; then
            echo "minecraft_version is missing in gradle.properties" >&2
            exit 1
          fi

          java_version="$(sed -n 's/^java_version=//p' gradle.properties | head -n1)"
          if [[ -z "$java_version" ]]; then
            java_version="$(sed -n 's/.*targetJavaVersion *= *\([0-9][0-9]*\).*/\1/p' build.gradle | head -n1)"
          fi
          if [[ -z "$java_version" ]]; then
            echo "Could not determine Java version from gradle.properties or build.gradle" >&2
            exit 1
          fi

          gradle_version="$(sed -n 's#.*gradle-\([0-9][0-9.]*\)-bin.zip.*#\1#p' gradle/wrapper/gradle-wrapper.properties | head -n1)"
          if [[ -z "$gradle_version" ]]; then
            echo "Could not determine Gradle version from gradle-wrapper.properties" >&2
            exit 1
          fi

          if [[ -x ./gradlew ]]; then
            gradle_cmd="./gradlew"
          else
            gradle_cmd="gradle"
          fi

          echo "mc_version=$mc_version" >> "$GITHUB_OUTPUT"
          echo "java_version=$java_version" >> "$GITHUB_OUTPUT"
          echo "gradle_version=$gradle_version" >> "$GITHUB_OUTPUT"
          echo "gradle_cmd=$gradle_cmd" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.config.outputs.java_version }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.config.outputs.gradle_version }}

      - name: Build branch artifact
        run: ${{ steps.config.outputs.gradle_cmd }} clean build

      - name: Prepare release files
        id: package
        shell: bash
        run: |
          mkdir -p release-artifacts
          shopt -s nullglob

          jars=(build/libs/*.jar)
          if [[ ${#jars[@]} -eq 0 ]]; then
            echo "No jars were produced in build/libs" >&2
            exit 1
          fi

          runtime_found=false
          for jar in "${jars[@]}"; do
            name="$(basename "$jar")"
            if [[ "$name" == *-sources.jar || "$name" == *-dev.jar || "$name" == *-javadoc.jar ]]; then
              continue
            fi

            runtime_found=true
            ext="${name##*.}"
            target="shootexp-fabric-mc${{ steps.config.outputs.mc_version }}-${GITHUB_REF_NAME}.${ext}"
            cp "$jar" "release-artifacts/$target"
          done

          if [[ "$runtime_found" != true ]]; then
            echo "No runtime jar found in build/libs" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.branch }}
          path: release-artifacts/*
          if-no-files-found: error

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*
